name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Tesseract
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-eng
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Run tests (including OCR end-to-end)
        run: pytest -q
        env:
          LABELCHECK_TIMING_BUDGET_MS: "30000"  # shared runners; the 5 s budget is verified on the deployment
      - name: Benchmark the sample set
        run: python scripts/bench.py --verbose
